name: book_app
description: "Book reader with seamless switch to speed reading (RSVP)."
publish_to: 'none'

version: 0.1.0+15

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.7
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  path_provider: ^2.1.6
  sqlite3: ^3.7.1
  xml: ^7.1.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/licenses/
    # Page textures drawn by tool/textures/build_textures.py.
    - assets/textures/
    # TeX hyph-utf8 patterns, unchanged (licenses inside the files).
    - assets/hyphenation/

  # Static, subset fonts built by tool/fonts/build_fonts.py (OFL, see
  # assets/fonts/licenses/). Book fonts: regular, italic, bold, bold italic.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
        - asset: assets/fonts/Literata-BoldItalic.ttf
          weight: 700
          style: italic
    - family: PT Serif
      fonts:
        - asset: assets/fonts/PTSerif-Regular.ttf
        - asset: assets/fonts/PTSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/PTSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/PTSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSerif-BoldItalic.ttf
          weight: 700
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
